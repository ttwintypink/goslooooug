<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Госуслуги</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="full-loader"><div class="full-loader-spinner"></div></div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script>
    /* Роутер: смотрит состояние и редиректит на нужную страницу. */
    (function () {
        const remembered = Session.getRememberedUsername();
        const initial = Common.getInitialUsername();
        const username = remembered || initial;

        if (!username) {
            location.replace('login.html');
            return;
        }
        if (Session.isPinPassed()) {
            location.replace('home.html');
        } else if (remembered) {
            location.replace('pin.html');
        } else {
            location.replace('login.html');
        }
    })();
    </script>
</body>
</html>
