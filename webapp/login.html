<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Госуслуги — вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Фаза 1: пароль -->
<section id="phase-password" class="screen">
    <div class="login-wrapper">
        <div class="login-logo">
            <div class="gu-logo">
                <svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true">
                    <defs>
                        <linearGradient id="loginGuBg" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FFFFFF"/>
                            <stop offset="100%" stop-color="#F4F4F4"/>
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#loginGuBg)"/>
                    <!-- Стилизованный флаг РФ + капля «Г» -->
                    <path d="M40 14 C28 14 20 22 20 36 V54 C20 62 26 66 32 66 H46 C50 66 54 62 54 56 V44 C54 38 50 34 44 34 L34 34 V36 H44 C46 36 48 38 48 40 V52 C48 54 46 56 44 56 L34 56 C30 56 28 54 28 50 V36 C28 26 32 22 40 22 C48 22 52 26 52 32 L60 32 C60 22 52 14 40 14 Z" fill="#0A48C2"/>
                    <path d="M52 14 L60 14 L60 26 L52 26 Z" fill="#E64545"/>
                </svg>
            </div>
        </div>

        <h1 class="login-title">Госуслуги</h1>
        <p class="login-subtitle">Вход в личный кабинет</p>

        <div class="form-group">
            <label for="login-username">Логин</label>
            <input id="login-username" type="text" autocomplete="username" readonly />
        </div>

        <div class="form-group">
            <label for="login-password">Пароль</label>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="Введите пароль" />
        </div>

        <p id="login-error" class="form-error hidden"></p>

        <button id="login-submit" class="btn btn-primary btn-block">Войти</button>

        <p class="login-hint">
            При первом входе используйте пароль <b>admin</b>.<br />
            После — задайте PIN-код для быстрого входа.
        </p>
    </div>
</section>

<!-- Фаза 2: создание PIN-кода (после успешного пароля) -->
<section id="phase-setpin" class="screen hidden">
    <div class="pin-wrapper">
        <div class="pin-avatar">
            <svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
                <circle cx="32" cy="22" r="12" fill="#8E8E93"/>
                <path d="M10 60 C10 44, 54 44, 54 60 Z" fill="#8E8E93"/>
            </svg>
        </div>
        <div id="setpin-username" class="pin-username">@username</div>
        <div id="setpin-title" class="pin-title">Придумайте PIN-код</div>

        <div id="setpin-dots" class="pin-dots">
            <span class="pin-dot"></span>
            <span class="pin-dot"></span>
            <span class="pin-dot"></span>
            <span class="pin-dot"></span>
        </div>

        <div id="setpin-numpad" class="pin-numpad">
            <button class="pin-key" data-key="1">1</button>
            <button class="pin-key" data-key="2">2</button>
            <button class="pin-key" data-key="3">3</button>
            <button class="pin-key" data-key="4">4</button>
            <button class="pin-key" data-key="5">5</button>
            <button class="pin-key" data-key="6">6</button>
            <button class="pin-key" data-key="7">7</button>
            <button class="pin-key" data-key="8">8</button>
            <button class="pin-key" data-key="9">9</button>
            <button class="pin-key pin-key-empty" disabled></button>
            <button class="pin-key" data-key="0">0</button>
            <button class="pin-key pin-key-back" data-key="back" aria-label="Стереть">
                <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
                    <path d="M9 0 L28 0 L28 20 L9 20 L0 10 Z" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
                    <path d="M14 6 L21 14 M21 6 L14 14" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
</section>

<script src="js/common.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
