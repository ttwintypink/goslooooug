<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Скоро</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="screen">
    <header class="nav-bar">
        <button class="nav-back" data-back-to="home.html">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M15 6 L9 12 L15 18" fill="none" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Назад</span>
        </button>
        <div id="cs-nav-title" class="nav-title">Раздел</div>
        <div class="nav-spacer"></div>
    </header>

    <main class="coming-screen">
        <div class="coming-icon">
            <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
                <circle cx="24" cy="24" r="20" fill="none" stroke="#0A84FF" stroke-width="2.4"/>
                <path d="M24 12 V24 L32 28" fill="none" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div id="cs-title" class="coming-title">Скоро</div>
        <div class="coming-subtitle">Этот раздел в разработке. Загляните позже.</div>
    </main>
</section>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
    'use strict';
    const username = requireAuth();
    if (!username) return;

    const params = new URLSearchParams(location.search);
    const title = params.get('title') || 'Раздел';
    document.getElementById('cs-nav-title').textContent = title;
    document.getElementById('cs-title').textContent = title + ' — скоро';
    document.title = title + ' — Госуслуги';

    document.querySelectorAll('.nav-back').forEach(btn => {
        btn.addEventListener('click', () => {
            Common.haptic('light');
            location.href = btn.dataset.backTo || 'home.html';
        });
    });
})();
</script>
</body>
</html>
