<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Паспорт — подробности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="screen">
    <header class="nav-bar">
        <button class="nav-back" data-back-to="passport.html" aria-label="Назад">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M15 6 L9 12 L15 18" fill="none" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="nav-title">Паспорт РФ</div>
        <div class="nav-spacer"></div>
    </header>

    <main class="details-screen">
        <ul class="details-list">
            <li class="details-row" data-field="passport_series_number" data-entity="passport">
                <span class="details-label">Серия и номер</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="issue_date" data-entity="passport">
                <span class="details-label">Дата выдачи</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="subdivision_code" data-entity="passport">
                <span class="details-label">Код подразделения</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="issued_by" data-entity="passport">
                <span class="details-label">Кем выдан</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="fio" data-entity="passport">
                <span class="details-label">ФИО</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="gender" data-entity="passport">
                <span class="details-label">Пол</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="birth_date" data-entity="passport">
                <span class="details-label">Дата рождения</span>
                <span class="details-value">—</span>
            </li>
            <li class="details-row" data-field="birth_place" data-entity="passport">
                <span class="details-label">Место рождения</span>
                <span class="details-value">—</span>
            </li>
        </ul>

        <section class="attachments-section">
            <div class="attachments-title">Фото, сканы или pdf</div>
            <button id="attach-add" class="attach-btn">
                <svg viewBox="0 0 18 18" width="14" height="14" aria-hidden="true">
                    <path d="M11 3 L11 11 L7 11 L7 3 L4 3 L4 12 C4 14, 6 15, 8 15 L9 15 C12 15, 14 13, 14 11 L14 3 Z"
                          fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
                Добавить
            </button>
            <input id="attach-input" type="file" accept="image/*,.pdf" hidden />
        </section>
    </main>
</section>

<!-- Action sheet -->
<div id="attach-sheet" class="action-sheet-overlay hidden">
    <div class="action-sheet">
        <div class="action-sheet-title">Выберите способ добавления</div>
        <button class="action-sheet-btn" data-action="scan">Сканировать документ</button>
        <button class="action-sheet-btn" data-action="gallery">Выбрать из галереи</button>
        <button class="action-sheet-btn" data-action="file">Выбрать файл</button>
    </div>
    <button class="action-sheet-cancel" id="attach-cancel">Отмена</button>
</div>

<script src="js/common.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-edit.js"></script>
<script src="js/passport-details.js"></script>
</body>
</html>
