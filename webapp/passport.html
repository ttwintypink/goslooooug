<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Паспорт РФ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="screen">
    <header class="nav-bar">
        <button class="nav-back" data-back-to="home.html" aria-label="Назад">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M15 6 L9 12 L15 18" fill="none" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="nav-title">Паспорт РФ</div>
        <button class="nav-back" id="passport-share" aria-label="Поделиться" style="justify-self: end;">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M12 4 V16 M8 8 L12 4 L16 8" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 14 V19 H19 V14" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </header>

    <main class="passport-screen">
        <div class="passport-card">
            <div class="passport-card-header">
                <span class="passport-card-title">РОССИЙСКАЯ ФЕДЕРАЦИЯ</span>
            </div>

            <!-- водяной знак: двуглавый орёл -->
            <div class="passport-emblem-watermark">
                <svg viewBox="0 0 200 200" width="220" height="220" aria-hidden="true">
                    <g fill="#8B1424" opacity="0.9">
                        <!-- центральный щит -->
                        <path d="M100 70 L115 80 L115 110 C115 122 100 130 100 130 C100 130 85 122 85 110 L85 80 Z"/>
                        <!-- левая голова -->
                        <ellipse cx="70" cy="68" rx="14" ry="18"/>
                        <path d="M56 64 L48 56 L52 70 Z"/>
                        <!-- правая голова -->
                        <ellipse cx="130" cy="68" rx="14" ry="18"/>
                        <path d="M144 64 L152 56 L148 70 Z"/>
                        <!-- крылья -->
                        <path d="M70 80 C50 90 40 110 45 130 L70 110 Z"/>
                        <path d="M130 80 C150 90 160 110 155 130 L130 110 Z"/>
                        <!-- хвост -->
                        <path d="M85 130 L100 145 L115 130 L110 150 L100 158 L90 150 Z"/>
                        <!-- корона -->
                        <rect x="95" y="50" width="10" height="6"/>
                        <path d="M92 50 L96 44 L100 50 L104 44 L108 50 Z"/>
                    </g>
                </svg>
            </div>

            <div class="passport-card-body">

                <div class="passport-photo-wrapper">
                    <div id="passport-photo" class="passport-photo">
                        <svg viewBox="0 0 64 80" width="60" height="76" aria-hidden="true">
                            <circle cx="32" cy="28" r="14" fill="rgba(0,0,0,0.18)"/>
                            <path d="M8 78 C8 60, 56 60, 56 78 Z" fill="rgba(0,0,0,0.18)"/>
                        </svg>
                    </div>
                    <button id="passport-photo-edit" class="pencil-btn pencil-on-photo hidden" aria-label="Изменить фото">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                            <path d="M11 2 L14 5 L5 14 L2 14 L2 11 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <input id="passport-photo-input" type="file" accept="image/*" hidden />
                </div>

                <div class="passport-number-row">
                    <span class="passport-number" id="passport-number-display">— —</span>
                    <button class="passport-copy-btn" id="passport-copy" aria-label="Копировать">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                            <rect x="3" y="2" width="9" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                            <rect x="5" y="4" width="9" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                        </svg>
                    </button>
                </div>

                <div class="passport-field passport-area-issued" data-field="issued_by" data-entity="passport">
                    <span class="passport-field-label">Кем выдан</span>
                    <span class="passport-field-value">—</span>
                </div>

                <div class="passport-area-dates">
                    <div class="passport-field" data-field="issue_date" data-entity="passport">
                        <span class="passport-field-label">Дата выдачи</span>
                        <span class="passport-field-value">—</span>
                    </div>
                    <div class="passport-field" data-field="subdivision_code" data-entity="passport">
                        <span class="passport-field-label">Код подразделения</span>
                        <span class="passport-field-value">—</span>
                    </div>
                </div>

                <div class="passport-field passport-area-fio" data-field="fio" data-entity="passport">
                    <span class="passport-field-label">ФИО</span>
                    <span class="passport-field-value">—</span>
                </div>

                <div class="passport-field passport-area-gender" data-field="gender" data-entity="passport">
                    <span class="passport-field-label">Пол</span>
                    <span class="passport-field-value">—</span>
                </div>

                <div class="passport-field passport-area-birth" data-field="birth_date" data-entity="passport">
                    <span class="passport-field-label">Дата рождения</span>
                    <span class="passport-field-value">—</span>
                </div>

                <div class="passport-field passport-area-place" data-field="birth_place" data-entity="passport">
                    <span class="passport-field-label">Место рождения</span>
                    <span class="passport-field-value">—</span>
                </div>

                <a href="passport-details.html" class="passport-details-link" id="passport-details-link">детали документа</a>
            </div>
        </div>

        <button id="passport-present">
            <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true">
                <rect x="1" y="1" width="6" height="6" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
                <rect x="11" y="1" width="6" height="6" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
                <rect x="1" y="11" width="6" height="6" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
                <rect x="11" y="11" width="2" height="2" fill="#FFFFFF"/>
                <rect x="15" y="11" width="2" height="2" fill="#FFFFFF"/>
                <rect x="11" y="15" width="2" height="2" fill="#FFFFFF"/>
                <rect x="15" y="15" width="2" height="2" fill="#FFFFFF"/>
            </svg>
            Предъявить в МАХ
        </button>
    </main>
</section>

<script src="js/common.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-edit.js"></script>
<script src="js/passport.js"></script>
</body>
</html>
