<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Госуслуги</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="screen home-screen">

    <!-- Шапка: имя + чевр, поиск, колокольчик, госкан -->
    <header class="home-header">
        <button id="profile-btn" class="profile-btn" aria-label="Профиль">
            <span class="profile-avatar">
                <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
                    <circle cx="16" cy="12" r="6" fill="#8E8E93"/>
                    <path d="M4 30 C4 22, 28 22, 28 30 Z" fill="#8E8E93"/>
                </svg>
            </span>
            <span class="profile-name" id="profile-name">Дмитрий</span>
            <span class="profile-chevron">
                <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true">
                    <path d="M4 2 L8 6 L4 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </button>

        <div class="home-header-icons">
            <button id="btn-admin" class="icon-btn-flat hidden" aria-label="Админ-панель">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="9" cy="8" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
                    <path d="M3 20 C3 16, 15 16, 15 20" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="17.5" cy="9.5" r="2.4" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
                    <path d="M14 19 C14 16.5, 21 16.5, 21 19" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="btn-search" class="icon-btn-flat" aria-label="Поиск">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                    <path d="M16.5 16.5 L21 21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="btn-notifications" class="icon-btn-flat" aria-label="Уведомления">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path d="M12 3 C8 3 6 6 6 10 V14 L4 17 H20 L18 14 V10 C18 6 16 3 12 3 Z"
                          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M10 19 C10 20.5 11 21 12 21 C13 21 14 20.5 14 19"
                          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span id="notif-dot" class="notif-dot hidden"></span>
            </button>
            <button class="goskan-pill" aria-label="Госкан">
                <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                    <path d="M2 4 V2 H4" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
                    <path d="M14 4 V2 H12" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
                    <path d="M2 12 V14 H4" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
                    <path d="M14 12 V14 H12" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
                    <rect x="4" y="6" width="1.5" height="4" fill="#FFFFFF"/>
                    <rect x="7" y="6" width="1" height="4" fill="#FFFFFF"/>
                    <rect x="10" y="6" width="2" height="4" fill="#FFFFFF"/>
                </svg>
                госкан
            </button>
        </div>
    </header>

    <main class="home-content">

        <!-- Горизонтальные пилюли -->
        <div class="pills-row">
            <button class="pill" data-pill="egrn">Сведения ЕГРН</button>
            <button class="pill" data-pill="doctor">Запись к врачу</button>
            <button class="pill" data-pill="inn">ИНН</button>
            <button class="pill" data-pill="decisions">Решения</button>
        </div>

        <!-- Промо-карусель -->
        <div class="promo-row">
            <button class="promo-card promo-1" data-promo="protect">
                <span class="promo-card-title">Защита близких от взлома</span>
                <span class="promo-card-icon">
                    <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                        <path d="M14 4 L23 7 V14 C23 19, 19 22, 14 24 C9 22, 5 19, 5 14 V7 Z" fill="#3E8C58"/>
                        <path d="M10 13 L13 16 L18 11" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </button>
            <button class="promo-card promo-2" data-promo="tax">
                <span class="promo-card-title">Оформите налоговый вычет</span>
                <span class="promo-card-icon">
                    <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                        <circle cx="14" cy="14" r="10" fill="#D8902A"/>
                        <text x="14" y="19" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system">₽</text>
                    </svg>
                </span>
            </button>
            <button class="promo-card promo-3" data-promo="rent">
                <span class="promo-card-title">Оформление аренды</span>
                <span class="promo-card-icon">
                    <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                        <path d="M5 14 L14 6 L23 14 V23 H17 V17 H11 V23 H5 Z" fill="#7058D8"/>
                    </svg>
                </span>
            </button>
            <button class="promo-card promo-4" data-promo="business">
                <span class="promo-card-title">Начните бизнес онлайн</span>
                <span class="promo-card-icon">
                    <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                        <rect x="5" y="9" width="18" height="13" rx="2" fill="#C28A35"/>
                        <path d="M10 9 V7 H18 V9" fill="none" stroke="#C28A35" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
            </button>
        </div>

        <!-- Начисления -->
        <div id="charges-card" class="charges-card charges-empty">
            <div class="charges-header">
                <span class="charges-title" id="charges-amount">Нет начислений</span>
            </div>
            <div class="charges-sub" id="charges-sub">уточните данные</div>
            <div id="charges-list" class="charges-list hidden"></div>
            <button id="charges-pay" class="btn btn-primary btn-block hidden">Оплатить</button>
        </div>

        <!-- Алёрт про Цифровой ID -->
        <div class="alert-card">
            <div class="alert-header">
                <span class="alert-dot"></span>
                <span class="alert-title">Разблокируйте доступ с помощью<br/>Цифрового ID</span>
            </div>
            <div class="alert-time">Вчера в 20:43</div>
            <div class="alert-body">Для вашей безопасности часть функций ограничена на 72 часа</div>
            <div class="alert-actions">
                <button class="alert-btn">разблокировать</button>
                <button class="alert-btn">подробнее</button>
            </div>
        </div>

        <!-- Документы для предъявления -->
        <section class="home-section">
            <h2 class="home-section-title">Документы для предъявления</h2>
            <div class="doc-tiles">
                <button class="doc-tile" data-go="passport.html" aria-label="Паспорт">
                    <span class="doc-tile-icon tile-passport">
                        <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
                            <path d="M20 8 C16 8 14 11 14 14 C14 16 15 17 16 18 L13 22 L17 22 L15 26 L19 26 L19 31 L21 31 L21 26 L25 26 L23 22 L27 22 L24 18 C25 17 26 16 26 14 C26 11 24 8 20 8 Z" fill="#FFD60A"/>
                            <circle cx="16" cy="13" r="1.4" fill="#7A1F26"/>
                            <circle cx="24" cy="13" r="1.4" fill="#7A1F26"/>
                            <path d="M19 16 L20 18 L21 16" fill="none" stroke="#7A1F26" stroke-width="1" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="doc-tile-label">Паспорт</span>
                </button>

                <button class="doc-tile" data-go="oms" aria-label="Полис ОМС">
                    <span class="doc-tile-icon tile-oms">
                        <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
                            <rect x="17" y="9" width="6" height="22" rx="1.5" fill="#FFFFFF"/>
                            <rect x="9" y="17" width="22" height="6" rx="1.5" fill="#FFFFFF"/>
                        </svg>
                    </span>
                    <span class="doc-tile-label">Полис ОМС</span>
                </button>

                <button class="doc-tile" data-go="snils" aria-label="СНИЛС">
                    <span class="doc-tile-icon tile-snils">
                        <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
                            <rect x="7" y="11" width="26" height="18" rx="3" fill="#FFFFFF"/>
                            <rect x="7" y="14" width="26" height="3" fill="#1E8C42"/>
                            <rect x="11" y="21" width="10" height="2" rx="1" fill="#1E8C42" opacity="0.5"/>
                            <rect x="11" y="25" width="14" height="2" rx="1" fill="#1E8C42" opacity="0.5"/>
                        </svg>
                    </span>
                    <span class="doc-tile-label">СНИЛС</span>
                </button>

                <button class="doc-tile" data-go="docs-all" aria-label="Все документы">
                    <span class="doc-tile-icon tile-all">
                        <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
                            <rect x="9" y="10" width="16" height="20" rx="2" fill="#FFFFFF" opacity="0.55"/>
                            <rect x="13" y="13" width="16" height="20" rx="2" fill="#FFFFFF" opacity="0.8"/>
                            <rect x="17" y="16" width="16" height="20" rx="2" fill="#FFFFFF"/>
                        </svg>
                    </span>
                    <span class="doc-tile-label">Все</span>
                </button>
            </div>
        </section>

        <!-- Сервисы и приложения -->
        <section class="home-section">
            <h2 class="home-section-title">Сервисы и приложения</h2>
            <div class="service-tiles">
                <button class="service-tile" data-service="health">
                    <span class="service-tile-icon" style="background-color: rgba(255,69,58,0.15);">
                        <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                            <path d="M2 14 L7 14 L9 9 L13 19 L15 12 L17 14 L26 14" fill="none" stroke="#FF453A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="service-tile-label">Здоровье</span>
                </button>
                <button class="service-tile" data-service="auto">
                    <span class="service-tile-icon" style="background-color: rgba(10,132,255,0.15);">
                        <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                            <path d="M4 17 L6 11 C6.5 9.5, 8 9, 9.5 9 L18.5 9 C20 9, 21.5 9.5, 22 11 L24 17 V20 H4 Z" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linejoin="round"/>
                            <circle cx="9" cy="20" r="2" fill="#0A84FF"/>
                            <circle cx="19" cy="20" r="2" fill="#0A84FF"/>
                        </svg>
                    </span>
                    <span class="service-tile-label">Авто</span>
                </button>
                <button class="service-tile" data-service="school">
                    <span class="service-tile-icon" style="background-color: rgba(255,45,85,0.15);">
                        <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                            <path d="M14 5 L25 11 L14 17 L3 11 Z" fill="none" stroke="#FF2D55" stroke-width="1.8" stroke-linejoin="round"/>
                            <path d="M8 13 V18 C8 20.5, 20 20.5, 20 18 V13" fill="none" stroke="#FF2D55" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M25 11 V17" fill="none" stroke="#FF2D55" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="service-tile-label">Моя школа</span>
                </button>
                <button class="service-tile" data-service="other">
                    <span class="service-tile-icon" style="background-color: rgba(142,142,147,0.18);">
                        <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
                            <circle cx="7" cy="7" r="2.4" fill="#FFFFFF"/>
                            <circle cx="14" cy="7" r="2.4" fill="#FFFFFF"/>
                            <circle cx="21" cy="7" r="2.4" fill="#FFFFFF"/>
                            <circle cx="7" cy="14" r="2.4" fill="#FFFFFF"/>
                            <circle cx="14" cy="14" r="2.4" fill="#FFFFFF"/>
                            <circle cx="21" cy="14" r="2.4" fill="#FFFFFF"/>
                            <circle cx="7" cy="21" r="2.4" fill="#FFFFFF"/>
                            <circle cx="14" cy="21" r="2.4" fill="#FFFFFF"/>
                            <circle cx="21" cy="21" r="2.4" fill="#FFFFFF"/>
                        </svg>
                    </span>
                    <span class="service-tile-label">Другие</span>
                </button>
            </div>
        </section>

        <p class="home-note">Уведомления и статусы заявлений теперь в колокольчике сверху</p>
    </main>

    <!-- Bottom tab bar -->
    <nav class="tab-bar">
        <button class="tab-item active" data-tab="home">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span>Главная</span>
        </button>
        <button class="tab-item" data-tab="services">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>услуги</span>
        </button>
        <button class="tab-item tab-center" data-tab="assistant">
            <span class="tab-center-icon">
                <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
                    <!-- голова -->
                    <ellipse cx="20" cy="22" rx="14" ry="13" fill="#FFFFFF"/>
                    <!-- хохолок -->
                    <path d="M16 9 C18 6 22 6 24 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
                    <!-- глаза -->
                    <circle cx="15" cy="21" r="2.4" fill="#0A48C2"/>
                    <circle cx="25" cy="21" r="2.4" fill="#0A48C2"/>
                    <!-- блики -->
                    <circle cx="15.7" cy="20.3" r="0.8" fill="#FFFFFF"/>
                    <circle cx="25.7" cy="20.3" r="0.8" fill="#FFFFFF"/>
                    <!-- улыбка -->
                    <path d="M15 27 C17.5 29.5 22.5 29.5 25 27" fill="none" stroke="#0A48C2" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </span>
        </button>
        <button class="tab-item" data-tab="payments">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M3 10 H21" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>платежи</span>
        </button>
        <button class="tab-item" data-tab="documents">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M7 3 H15 L19 7 V21 H7 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M14 3 V8 H19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>документы</span>
        </button>
    </nav>
</section>

<!-- BOTTOM SHEET -->
<div id="bs-overlay" class="bs-overlay hidden"></div>
<aside id="bs-notifications" class="bottom-sheet hidden" role="dialog" aria-label="Уведомления">
    <div class="bs-grip"></div>
    <h3 class="bs-title">Уведомления</h3>
    <div id="bs-notifications-list" class="bs-list">
        <div class="bs-empty">Нет уведомлений</div>
    </div>
</aside>

<script src="js/common.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/home.js"></script>
</body>
</html>
